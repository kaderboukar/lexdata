server:
  port: 9011

spring:
  application:
    name: lexdata-consultations
  datasource:
    url: jdbc:postgresql://localhost:5431/lexdata_db
    username: lexdata_user
    password: secret_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://admin:admin_password@lexdata-discovery:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

lexdata:
  app:
    jwtSecret: 404E635266556A586E3272375782413F4428472B4B6250645367566B5970337336763979244226452948404D6351655468576D5A71347437
    jwtExpirationMs: 86400000
