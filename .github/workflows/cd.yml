# =============================================================================
# CD — Continuous Delivery
# Triggers on push to main only.
# Builds each microservice JAR, packages it into a Docker image,
# and pushes it to GitHub Container Registry (GHCR).
# Uses GITHUB_TOKEN — no extra secrets needed for GHCR.
# =============================================================================
name: CD — Build & Push Docker Images

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/lexdata

jobs:
  # ─── Step 1: compile all JARs ───────────────────────────────────────────────
  build-jars:
    name: Build all Maven JARs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Package all services (skip tests — already run by CI)
        run: mvn package -DskipTests --no-transfer-progress -B

      - name: Upload built JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: '*/target/*.jar'
          retention-days: 1

  # ─── Step 2: build & push Docker images (matrix) ───────────────────────────
  push-images:
    name: Push ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: build-jars
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: discovery-service,  dir: lexdata-discovery-service,  image: discovery-service }
          - { name: gateway,             dir: lexdata-gateway,             image: gateway }
          - { name: auth-service,        dir: lexdata-auth-service,        image: auth-service }
          - { name: user-service,        dir: lexdata-user-service,        image: user-service }
          - { name: juridique-base,      dir: lexdata-juridique-base,      image: juridique-base }
          - { name: annuaire,            dir: lexdata-annuaire,            image: annuaire }
          - { name: veille,              dir: lexdata-veille,              image: veille }
          - { name: synthese,            dir: lexdata-synthese,            image: synthese }
          - { name: tribune,             dir: lexdata-tribune,             image: tribune }
          - { name: contrats,            dir: lexdata-contrats,            image: contrats }
          - { name: calendrier,          dir: lexdata-calendrier,          image: calendrier }
          - { name: consultations,       dir: lexdata-consultations,       image: consultations }
          - { name: paiements,           dir: lexdata-paiements,           image: paiements }
          - { name: notifications,       dir: lexdata-notifications,       image: notifications }
          - { name: admin,               dir: lexdata-admin,               image: admin }
          - { name: monitoring,          dir: lexdata-monitoring,          image: monitoring }

    steps:
      - uses: actions/checkout@v4

      - name: Download built JARs
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.image }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.dir }}
          file: Dockerfile.service
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # ─── Step 3: trigger deploy workflow ────────────────────────────────────────
  trigger-deploy:
    name: Trigger Kubernetes Deploy
    runs-on: ubuntu-latest
    needs: push-images
    steps:
      - name: Dispatch deploy workflow
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main',
              inputs: {
                sha: context.sha
              }
            })
