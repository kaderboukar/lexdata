server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip pour de meilleures performances
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy des appels API vers le Gateway Spring Cloud
    location /api/ {
        proxy_pass http://lexdata-gateway:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Indispensable : sinon la gateway ne reçoit pas le Bearer JWT → 403 « Accès refusé » (WebFlux)
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # Assets Vite (préfixe) — prioritaire sur location / ; évite tout conflit avec d’autres règles regex
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Toujours servir le bon shell SPA après déploiement
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA : routes comme /verify-email → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
