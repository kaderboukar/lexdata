---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexdata-synthese
  namespace: lexdata
  labels:
    app: lexdata-synthese
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lexdata-synthese
  template:
    metadata:
      labels:
        app: lexdata-synthese
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: synthese
          image: lexdata/synthese:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 9006
          env:
            - name: SERVER_PORT
              value: "9006"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: lexdata-synthese
          envFrom:
            - configMapRef:
                name: lexdata-config
            - secretRef:
                name: lexdata-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 9006
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9006
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9006
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "384Mi"
              cpu: "200m"
            limits:
              memory: "768Mi"
              cpu: "750m"
---
apiVersion: v1
kind: Service
metadata:
  name: lexdata-synthese
  namespace: lexdata
spec:
  selector:
    app: lexdata-synthese
  ports:
    - port: 9006
      targetPort: 9006
