---
# ===========================================================================
# Eureka Discovery Service — Deployment + Service
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexdata-discovery
  namespace: lexdata
  labels:
    app: lexdata-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lexdata-discovery
  template:
    metadata:
      labels:
        app: lexdata-discovery
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: discovery
          image: lexdata/discovery-service:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8761
          env:
            - name: SERVER_PORT
              value: "8761"
            - name: SPRING_SECURITY_USER_NAME
              valueFrom:
                secretKeyRef:
                  name: lexdata-secret
                  key: EUREKA_ADMIN_USERNAME
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lexdata-secret
                  key: EUREKA_ADMIN_PASSWORD
            - name: EUREKA_INSTANCE_HOSTNAME
              value: lexdata-discovery
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            # Standalone mode — do not register with itself
            - name: EUREKA_CLIENT_REGISTERWITHEUREKA
              value: "false"
            - name: EUREKA_CLIENT_FETCHREGISTRY
              value: "false"
          envFrom:
            - configMapRef:
                name: lexdata-config
            - secretRef:
                name: lexdata-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"

---
apiVersion: v1
kind: Service
metadata:
  name: lexdata-discovery
  namespace: lexdata
spec:
  selector:
    app: lexdata-discovery
  ports:
    - port: 8761
      targetPort: 8761
