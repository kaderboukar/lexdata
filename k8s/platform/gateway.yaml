---
# ===========================================================================
# API Gateway — Deployment + Service
# ===========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lexdata-gateway
  namespace: lexdata
  labels:
    app: lexdata-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lexdata-gateway
  template:
    metadata:
      labels:
        app: lexdata-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: lexdata/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: EUREKA_INSTANCE_HOSTNAME
              value: lexdata-gateway
          envFrom:
            - configMapRef:
                name: lexdata-config
            - secretRef:
                name: lexdata-secret
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              memory: "384Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "1000m"

---
apiVersion: v1
kind: Service
metadata:
  name: lexdata-gateway
  namespace: lexdata
spec:
  selector:
    app: lexdata-gateway
  ports:
    - port: 8081
      targetPort: 8081
