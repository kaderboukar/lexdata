---
# ===========================================================================
# Ingress — Routes external traffic to the API Gateway
# Requires: nginx ingress controller (kubectl apply -f
#   https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/cloud/deploy.yaml)
# ===========================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lexdata-ingress
  namespace: lexdata
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    # API calls (backend)
    - host: api.lexdata.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lexdata-gateway
                port:
                  number: 8081
    # Kibana dashboard
    - host: kibana.lexdata.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lexdata-kibana
                port:
                  number: 5601
    # Eureka dashboard (dev/ops use)
    - host: eureka.lexdata.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lexdata-discovery
                port:
                  number: 8761
