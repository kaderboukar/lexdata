spring:
  datasource:
    url: jdbc:h2:mem:userdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    discovery:
      enabled: false
  # Pas de broker RabbitMQ en test : évite ACCESS_REFUSED sur @RabbitListener
  rabbitmq:
    listener:
      simple:
        auto-startup: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# JwtUtils attend une clé hex (32 octets = 64 caractères hex) pour HS256
app:
  jwtSecret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

lexdata:
  app:
    jwtSecret: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
